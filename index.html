<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>市長不進議會，總統不進國會</title>
  <meta name="description" content="以可核對日期為起算點的時間海報：市長不進議會，總統不進國會。" />
  <meta property="og:title" content="市長不進議會，總統不進國會" />
  <meta property="og:description" content="以可核對日期為起算點的時間海報。" />
  <meta property="og:type" content="website" />
  <meta name="color-scheme" content="dark light" />

  <style>
    :root{
      --bg0:#05060A;
      --bg1:#0A0E1A;
      --text:#F4F7FF;
      --muted: rgba(244,247,255,.74);
      --muted2: rgba(244,247,255,.58);
      --line: rgba(255,255,255,.14);

      --a1:#7CFFCB; /* 清亮綠 */
      --a2:#7AA7FF; /* 星光藍 */
      --a3:#FF7AD9; /* 霓虹粉 */
      --a4:#FFD27A; /* 金色 */
      --danger:#FF5D6C;

      --shadow: 0 22px 70px rgba(0,0,0,.55);
      --glow: 0 0 60px rgba(122,167,255,.20);

      --radius: 22px;
      --radius2: 30px;

      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1100px 720px at 20% -10%, rgba(122,167,255,.30), transparent 60%),
        radial-gradient(900px 650px at 105% 5%, rgba(255,122,217,.24), transparent 56%),
        radial-gradient(900px 650px at 55% 115%, rgba(124,255,203,.16), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #04050A);
      overflow-x:hidden;
      min-height:100vh;
    }

    .aurora{
      position: fixed;
      inset: -30vh -20vw;
      pointer-events:none;
      opacity:.62;
      filter: blur(26px);
      mix-blend-mode: screen;
      background:
        conic-gradient(from 220deg,
          rgba(122,167,255,.00),
          rgba(122,167,255,.30),
          rgba(255,122,217,.22),
          rgba(255,210,122,.20),
          rgba(124,255,203,.20),
          rgba(122,167,255,.26),
          rgba(122,167,255,.00));
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift{
      0%{ transform: translate3d(-2%, -1%, 0) rotate(-6deg) scale(1.03); }
      100%{ transform: translate3d(3%, 2%, 0) rotate(7deg) scale(1.06); }
    }

    .wrap{
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 18px 72px;
      position:relative;
    }

    .poster{
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      box-shadow: var(--shadow), var(--glow);
      overflow:hidden;
      position:relative;
    }
    .poster:before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 180px at 20% 0%, rgba(124,255,203,.28), transparent 60%),
        radial-gradient(900px 180px at 80% 0%, rgba(255,122,217,.24), transparent 60%),
        radial-gradient(900px 260px at 50% 120%, rgba(122,167,255,.18), transparent 62%);
      filter: blur(10px);
      opacity:.9;
      pointer-events:none;
    }
    .poster > *{ position:relative; z-index:1; }

    header{
      padding: 22px 22px 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .heroRow{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 980px){
      .heroRow{ grid-template-columns: 1fr; }
    }

    .headline{
      border-radius: 22px;
      padding: 18px 16px 14px;
      background: linear-gradient(135deg, rgba(0,0,0,.22), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.12);
      overflow:hidden;
      position:relative;
    }
    .headline:after{
      content:"";
      position:absolute;
      inset:-2px;
      background: conic-gradient(from 180deg,
        rgba(124,255,203,.00),
        rgba(124,255,203,.26),
        rgba(122,167,255,.30),
        rgba(255,122,217,.26),
        rgba(255,210,122,.22),
        rgba(124,255,203,.24),
        rgba(124,255,203,.00));
      filter: blur(16px);
      opacity:.38;
      pointer-events:none;
    }
    .headline > *{ position:relative; z-index:1; }

    h1{
      margin:0;
      font-size: clamp(30px, 4.2vw, 54px);
      letter-spacing: .9px;
      line-height: 1.02;
      text-shadow: 0 18px 50px rgba(0,0,0,.60);
    }
    .slogan{
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      max-width: 78ch;
    }

    .stamps{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    .stamp{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 13px;
      white-space:nowrap;
    }
    .stamp b{ color: var(--text); }

    .corner{
      border-radius: 22px;
      padding: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.16));
      border: 1px solid rgba(255,255,255,.12);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap: 12px;
    }
    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
    }
    .pill label{
      font-size: 12px;
      color: var(--muted2);
      white-space:nowrap;
    }
    .pill input{
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      background: transparent;
      border: none;
      outline:none;
      width: 175px;
    }
    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:none;
      cursor:pointer;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      letter-spacing:.2px;
      color:#07111E;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      box-shadow: 0 14px 34px rgba(122,167,255,.22);
    }
    .btn:active{ transform: translateY(1px); }
    .miniBadge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--muted2);
      font-size: 12px;
      font-family: var(--mono);
      white-space:nowrap;
    }

    .note{
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.7;
      margin: 10px 0 0;
    }
    .note code{
      font-family: var(--mono);
      background: rgba(255,255,255,.07);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.10);
    }

    .content{
      padding: 18px 18px 20px;
      display:grid;
      grid-template-columns: 1.22fr .78fr;
      gap: 16px;
    }
    @media (max-width: 980px){
      .content{ grid-template-columns: 1fr; }
    }

    .stack{ display:grid; gap: 12px; }

    .panel{
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(135deg, rgba(0,0,0,.22), rgba(255,255,255,.05));
      border-radius: var(--radius);
      overflow:hidden;
      position:relative;
    }
    .panel:before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(700px 220px at 10% 0%, rgba(124,255,203,.16), transparent 60%),
        radial-gradient(640px 240px at 100% 10%, rgba(255,122,217,.16), transparent 55%),
        radial-gradient(620px 260px at 50% 120%, rgba(122,167,255,.12), transparent 55%);
      opacity:.95;
      pointer-events:none;
    }
    .panel > *{ position:relative; z-index:1; }

    .panelHead{
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      align-items:flex-start;
    }
    .panelHead h2{
      margin:0;
      font-size: 15px;
      line-height:1.35;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap: 10px;
      max-width: 76ch;
    }
    .panelHead p{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
      max-width: 84ch;
    }
    .since{
      margin-left:auto;
      text-align:right;
      color: var(--muted2);
      font-size: 12px;
      font-family: var(--mono);
      white-space:nowrap;
    }

    .mega{
      padding: 12px 14px 14px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 560px){
      .mega{ grid-template-columns: 1fr; }
    }

    .digit{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      padding: 12px 12px 10px;
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
      min-height: 82px;
      position:relative;
      overflow:hidden;
    }
    .digit:after{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(260px 90px at 30% 10%, rgba(255,210,122,.18), transparent 60%),
                  radial-gradient(240px 90px at 90% 30%, rgba(122,167,255,.16), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .digit > *{ position:relative; z-index:1; }

    .digit b{
      font-family: var(--mono);
      font-size: clamp(34px, 4vw, 54px);
      letter-spacing: 1px;
      line-height: 1;
      text-shadow:
        0 0 26px rgba(122,167,255,.24),
        0 0 34px rgba(255,122,217,.14),
        0 18px 60px rgba(0,0,0,.55);
    }
    .digit span{
      color: var(--muted);
      font-size: 12px;
      letter-spacing:.3px;
      padding-bottom: 6px;
      white-space:nowrap;
    }

    .side{ display:grid; gap: 12px; }

    .sideCard{
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.18));
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 18px 46px rgba(0,0,0,.36);
    }
    .sideCardHead{
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
    }
    .sideCardHead h3{
      margin:0;
      font-size: 14px;
      display:flex;
      align-items:center;
      gap:10px;
      letter-spacing:.2px;
    }
    .sideCardBody{ padding: 12px 14px 14px; }

    .timeline{
      margin:0;
      padding:0;
      list-style:none;
      display:grid;
      gap: 10px;
      position:relative;
    }
    .timeline:before{
      content:"";
      position:absolute;
      left: 11px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: rgba(255,255,255,.14);
    }
    .tItem{
      display:grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items:flex-start;
    }
    .dot{
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: radial-gradient(circle at 30% 30%, rgba(124,255,203,.70), rgba(122,167,255,.15));
      box-shadow: 0 0 26px rgba(122,167,255,.18);
      margin-top: 2px;
    }
    .tText b{
      display:block;
      font-size: 13.5px;
      letter-spacing:.2px;
      line-height: 1.25;
    }
